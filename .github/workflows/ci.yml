# CI , what a box would build from this commit, checked on every push and pull request.
#
#   server   go vet and every Go test (the Postgres ones against the runner's own Postgres over its
#            Unix socket, as on a box; they skip themselves when GHOST_PG_SOCKET_DIR is unset), then
#            a cross-compile for macOS, so the tree keeps building where contributors edit it
#   app      the Android app's JVM unit tests (no device, no emulator); the heavy job, so it runs
#            on pull requests and by hand (Actions › ci › Run workflow), not on every push
#
# Actions are free for a public repository; a push cancels a run still going on the same branch,
# so nothing stacks up. Nothing here reaches outside GitHub but the module proxy and Maven; the
# box never runs any of it.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Postgres, the runner's own, over its socket
        run: |
          sudo systemctl start postgresql
          sudo -u postgres createuser -s "$USER"
          sudo -u postgres psql -c "select version()"
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        env:
          GHOST_PG_SOCKET_DIR: /var/run/postgresql
          GHOST_PG_PORT: "5432"
          GHOST_PG_USER: runner
        run: |
          set -o pipefail
          go test ./... -count=1 2>&1 | tee test.log
      - name: what failed, named at the top of the run
        if: failure()
        run: |
          grep -A15 -- '^--- FAIL' test.log | head -300 || true
          grep -- '^--- FAIL' test.log | sed -E 's/^--- FAIL: (\S+).*/::error title=go test::\1 failed (the test step log has its lines)/' || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: server-test-log
          path: server/test.log
      - name: builds on macOS too (a contributor's editor, not a box)
        run: GOOS=darwin go vet ./...

  app:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
